# Auto-merge for Dependabot PRs
# Non-critical dependency updates are auto-merged if CI passes

name: Auto-merge Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'QG-1: TypeCheck + Lint + Unit'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Auto-merge
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is a patch/minor update
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Skip major updates (they need manual review)
            const title = pr.title.toLowerCase();
            if (title.includes('major')) {
              console.log('Major update — skipping auto-merge');
              return;
            }
            
            // Auto-merge patch and minor updates
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });
            
            console.log('Auto-merged Dependabot PR');
