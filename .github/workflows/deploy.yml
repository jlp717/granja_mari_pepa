name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # VALIDATE: Run full CI before deploying
  # ═══════════════════════════════════════════════════════════════
  validate:
    name: 'Pre-deploy Validation'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        run: npm run build
        env:
          CI: true

  # ═══════════════════════════════════════════════════════════════
  # DEPLOY: Auto-deploy to Netlify
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: 'Deploy to Netlify'
    runs-on: ubuntu-latest
    needs: [validate]
    if: success()

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: true

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: frontend/out
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy v${{ github.sha }} from CI"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  # ═══════════════════════════════════════════════════════════════
  # ROLLBACK: Auto-rollback if smoke test fails
  # ═══════════════════════════════════════════════════════════════
  smoke-test:
    name: 'Post-deploy Smoke Test'
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()

    steps:
      - name: Wait for deploy to propagate
        run: sleep 30

      - name: Smoke test — home page loads
        env:
          DOMAIN: ${{ secrets.DOMAIN || 'https://www.mari-pepa.com' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOMAIN/es")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Home page returned $STATUS"
            exit 1
          fi
          echo "✅ Home page OK (200)"

      - name: Smoke test — product page
        env:
          DOMAIN: ${{ secrets.DOMAIN || 'https://www.mari-pepa.com' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOMAIN/es/productos")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "⚠️  Product page: $STATUS (expected until catalog is built)"
          else
            echo "✅ Product page: $STATUS"
          fi

      - name: Smoke test — contact page
        env:
          DOMAIN: ${{ secrets.DOMAIN || 'https://www.mari-pepa.com' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOMAIN/es/contacto")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Contact page returned $STATUS"
            exit 1
          fi
          echo "✅ Contact page OK (200)"

      - name: Smoke test — SSL check
        env:
          DOMAIN: ${{ secrets.DOMAIN || 'https://www.mari-pepa.com' }}
        run: |
          SSL_INFO=$(curl -sI "$DOMAIN" | grep -i "strict-transport-security")
          if [ -z "$SSL_INFO" ]; then
            echo "⚠️  No HSTS header found"
          else
            echo "✅ HSTS header present"
          fi

  # ═══════════════════════════════════════════════════════════════
  # RELEASE: Tag and create release on successful deploy
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 'Auto-Release'
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: success()

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release tag
        id: tag
        run: |
          # Get latest tag, increment patch
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | sed 's/v//')
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)
          NEW_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/github-script@v9
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            
            // Generate changelog from commits since last release
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: releases[0]?.created_at || '2026-01-01T00:00:00Z',
              per_page: 50
            });
            
            const changes = commits
              .map(c => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.tag.outputs.new_tag }}',
              name: '${{ steps.tag.outputs.new_tag }}',
              body: `## What's Changed\n\n${changes || 'No significant changes'}\n\n---\n_Automated release from CI_`,
              prerelease: false
            });
