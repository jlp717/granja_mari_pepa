name: Notify on CI Failure

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create issue for CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const commit = run.head_commit || {};
            const headBranch = run.head_branch || 'unknown';
            const headSha = run.head_sha || 'unknown';
            const author = commit.author?.name || commit.committer?.name || 'unknown';
            const commitMessage = (commit.message || 'No commit message').split('\n')[0];
            
            // Create an issue summarizing the failure
            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: `🚨 CI Failure: ${run.display_title || run.name}`,
              body: `## CI Pipeline Failed

            **Workflow**: ${run.name}
            **Run ID**: ${run.id}
            **Branch**: ${headBranch}
            **Commit**: ${headSha}
            **Message**: ${commitMessage}
            **Author**: ${author}

            **View details**: ${run.html_url}

            This issue was automatically created because the CI pipeline failed.
            Please investigate and fix the issue before merging.

            ---
            _Automated notification — @orchestrator should review_
            `,
              labels: ['ci-failure', 'automated']
            });
