# ============================================
# NGINX CONFIGURATION - GRANJA MARI PEPA
# ============================================
# Configuración profesional con:
# - HTTPS/TLS 1.3
# - HTTP/2
# - Compresión Gzip/Brotli
# - Headers de seguridad
# - Rate limiting
# - Caching optimizado
# - Health checks
# ============================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream servers con health checks
upstream frontend {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# Cache path para assets estáticos
proxy_cache_path /var/cache/nginx/mari-pepa levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

# ============================================
# HTTP → HTTPS Redirect
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name mari-pepa.com www.mari-pepa.com;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS Server - Principal
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mari-pepa.com www.mari-pepa.com;

    # ========================================
    # SSL/TLS Configuration (Let's Encrypt)
    # ========================================
    ssl_certificate /etc/letsencrypt/live/mari-pepa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mari-pepa.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mari-pepa.com/chain.pem;
    
    # SSL Security - Modern configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # TLS 1.2 y 1.3 solamente
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ========================================
    # Security Headers
    # ========================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    
    # Content Security Policy (ajustar según necesidades)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.mari-pepa.com; frame-ancestors 'self';" always;

    # ========================================
    # Gzip Compression
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/x-javascript 
        application/xml 
        application/rss+xml 
        application/atom+xml 
        image/svg+xml;

    # ========================================
    # Rate Limiting & Connection Limits
    # ========================================
    limit_conn addr 100;
    
    # ========================================
    # Backend API Proxy
    # ========================================
    location /api/ {
        # Rate limiting para API
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # WebSocket support (futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # No cache para API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    
    # Rate limiting estricto para login
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Health Check Endpoint
    # ========================================
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Sin rate limiting para health checks
        limit_req off;
        
        access_log off;
    }

    # ========================================
    # Static Assets (Next.js)
    # ========================================
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache agresivo para assets inmutables
        proxy_cache STATIC;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Imágenes y fonts
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        proxy_cache STATIC;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ========================================
    # Frontend (Next.js SSR)
    # ========================================
    location / {
        limit_req zone=general burst=30 nodelay;
        
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================
    # Error Pages
    # ========================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ========================================
    # Logs
    # ========================================
    access_log /var/log/nginx/mari-pepa-access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/mari-pepa-error.log warn;
    
    # Log format personalizado (opcional)
    # access_log /var/log/nginx/mari-pepa-access.json json_combined;
}
