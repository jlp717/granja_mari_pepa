# ============================================
# NGINX CONFIGURATION - GRANJA MARI PEPA
# ============================================
# Versión HTTP-only (sin SSL) para testing inicial
# Una vez que el DNS propague y se configure SSL,
# usar mari-pepa.conf (versión completa con HTTPS)
# ============================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream servers
upstream frontend_mp {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream backend_mp {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# ============================================
# HTTP Server (Testing - Sin SSL)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name mari-pepa.com www.mari-pepa.com;
    
    # Let's Encrypt challenge (para cuando configuremos SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # ========================================
    # Security Headers
    # ========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================
    # Gzip Compression
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml 
        image/svg+xml;

    # ========================================
    # Rate Limiting & Connection Limits
    # ========================================
    limit_conn addr 100;
    
    # ========================================
    # Bulk Download - Large ZIP files (up to 2GB)
    # Must be BEFORE the general /api/ location
    # ========================================
    location /api/panamar/bulk-download/retrieve/ {
        proxy_pass http://backend_mp;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection '';

        # CRITICAL: Disable ALL buffering for large file streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # Keep TCP connection alive during long transfers
        proxy_socket_keepalive on;

        # High timeouts for 200MB+ file transfers (10 min)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # No rate limiting for downloads
        # No cache
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ========================================
    # Backend API Proxy
    # ========================================
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend_mp;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    
    # Rate limiting estricto para login
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        
        proxy_pass http://backend_mp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Health Check Endpoint
    # ========================================
    location /health {
        proxy_pass http://backend_mp/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ========================================
    # Frontend (Next.js)
    # ========================================
    location / {
        limit_req zone=general burst=30 nodelay;
        
        proxy_pass http://frontend_mp;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================
    # Logs
    # ========================================
    access_log /var/log/nginx/mari-pepa-access.log;
    error_log /var/log/nginx/mari-pepa-error.log warn;
}
